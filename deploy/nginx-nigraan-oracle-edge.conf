# Oracle edge (weather-vm / 152.67.162.136)
# Public options:
#   A) Domain (recommended): https://nigraan-api.aigeo360.com  →  DGX Tailscale 100.78.253.98:8787
#      DNS: A record nigraan-api.aigeo360.com → 152.67.162.136
#      Then: sudo certbot --nginx -d nigraan-api.aigeo360.com
#   B) Public IP port: http://152.67.162.136:8787
#      Open TCP 8787 in the OCI security list (same as weather:8810).
#
# Install on Oracle:
#   sudo cp nginx-nigraan-oracle-edge.conf /etc/nginx/sites-available/agn-nigraan.conf
#   sudo ln -sf /etc/nginx/sites-available/agn-nigraan.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

upstream nigraan_dgx {
	server 100.78.253.98:8787;
	keepalive 32;
}

# --- A) Domain on 80 (Certbot upgrades to 443) ---
server {
	listen 80;
	listen [::]:80;
	server_name nigraan-api.aigeo360.com;
	include /etc/nginx/snippets/agn-protect.conf;

	location /.well-known/acme-challenge/ {
		root /var/www/html;
	}

	location / {
		proxy_pass http://nigraan_dgx;
		proxy_http_version 1.1;
		proxy_set_header Connection "";
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_read_timeout 900s;
		proxy_send_timeout 900s;
		client_max_body_size 50m;
	}
}

# --- B) Public IP :8787 (needs OCI ingress for TCP 8787) ---
server {
	listen 8787;
	listen [::]:8787;
	server_name _;
	include /etc/nginx/snippets/agn-protect.conf;

	location / {
		proxy_pass http://nigraan_dgx;
		proxy_http_version 1.1;
		proxy_set_header Connection "";
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_read_timeout 900s;
		proxy_send_timeout 900s;
		client_max_body_size 50m;
	}
}
