# Oracle edge (weather-vm / 152.67.162.136)
# Frontend: https://nigraan-beta.vercel.app  (Vercel rewrites /api → this edge)
#
# Public reachability:
#   http://152.67.162.136/api/...          (port 80 — already open in OCI)
#   http://152.67.162.136:8787/api/...     (needs OCI ingress TCP 8787)
#   https://nigraan-api.aigeo360.com/...   (after DNS A → 152.67.162.136 + certbot)
#
# Upstream: DGX Tailscale 100.78.253.98:8787

upstream nigraan_dgx {
	server 100.78.253.98:8787;
	keepalive 32;
}

# Port 80 — IP + optional API hostname (works without opening a new OCI port)
server {
	listen 80;
	listen [::]:80;
	server_name nigraan-api.aigeo360.com 152.67.162.136;
	include /etc/nginx/snippets/agn-protect.conf;

	location /.well-known/acme-challenge/ {
		root /var/www/html;
	}

	location / {
		proxy_pass http://nigraan_dgx;
		proxy_http_version 1.1;
		proxy_set_header Connection "";
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		# Drop browser Origin so NIGRAAN cross-site gate stays quiet for Vercel rewrites
		proxy_set_header Origin "";
		proxy_set_header Sec-Fetch-Site "";
		proxy_read_timeout 900s;
		proxy_send_timeout 900s;
		client_max_body_size 50m;
	}
}

# Optional dedicated port (open TCP 8787 in OCI security list / NSG)
server {
	listen 8787;
	listen [::]:8787;
	server_name _;
	include /etc/nginx/snippets/agn-protect.conf;

	location / {
		proxy_pass http://nigraan_dgx;
		proxy_http_version 1.1;
		proxy_set_header Connection "";
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header Origin "";
		proxy_set_header Sec-Fetch-Site "";
		proxy_read_timeout 900s;
		proxy_send_timeout 900s;
		client_max_body_size 50m;
	}
}
